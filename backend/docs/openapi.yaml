openapi: 3.0.3
info:
  title: API сайта ЦПК при ТПП КР
  version: 1.0.0
  description: Публичное API сайта Центра промышленной кооперации. Все эндпоинты —
    GET без авторизации. Язык — параметр `?lang=ru|en|zh` (по умолчанию ru). Подробности
    для фронтенда — docs/API.md.
paths:
  /api/v1/contacts/:
    get:
      operationId: contacts_retrieve
      description: |-
        Единая обработка ?lang=ru|en|zh для всех вьюх: валидирует параметр
        (невалидный → 400) и передаёт язык в контекст сериализатора.
      summary: Контакты
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - ru
          - zh
          default: ru
        description: 'Язык ответа. По умолчанию ru. Невалидное значение → 400 `{"lang":
          ["..."]}`.'
      tags:
      - Справочная информация
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInfo'
              examples:
                Пример(seed-данные):
                  value:
                    official_name: Центр промышленной кооперации при Торгово-промышленной
                      палате Кыргызской Республики
                    address: 720000, г. Бишкек, ул. Примерная, 1 (тестовый адрес)
                    phones:
                    - label: Приёмная
                      number: +996 312 000 000
                    - label: Отдел кооперации
                      number: +996 312 000 001
                    email: info@example.kg
                    work_hours: Пн–Пт, 9:00–18:00
                    map_lat: 42.8746
                    map_lng: 74.6122
                    socials:
                    - type: telegram
                      url: https://t.me/example
                    - type: facebook
                      url: https://facebook.com/example
                  summary: Пример (seed-данные)
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Невалидный параметр: `{"<параметр>": ["ошибка"]}`'
  /api/v1/countries/:
    get:
      operationId: countries_list
      description: Активные страны, переведённые на `lang`.
      summary: Страны-партнёры
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - ru
          - zh
          default: ru
        description: 'Язык ответа. По умолчанию ru. Невалидное значение → 400 `{"lang":
          ["..."]}`.'
      tags:
      - Международное сотрудничество
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
              examples:
                Пример(seed-данные):
                  value:
                  - id: 5
                    code: CN
                    name: Китай
                    description: Ключевой партнёр Кыргызстана в промышленной кооперации.
                    flag:
                      small: http://localhost:8000/media/CACHE/images/flags/cn/016c0dbcea457959ba6bb508ac5f537f.webp
                      large: http://localhost:8000/media/CACHE/images/flags/cn/662eb7c33a66ec0595b18575d17bb2ac.webp
                    is_translated: true
                  summary: Пример (seed-данные)
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Невалидный параметр: `{"<параметр>": ["ошибка"]}`'
  /api/v1/directions/:
    get:
      operationId: directions_list
      description: Опубликованные и переведённые на `lang` направления по `order`
        (без content).
      summary: Направления
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - ru
          - zh
          default: ru
        description: 'Язык ответа. По умолчанию ru. Невалидное значение → 400 `{"lang":
          ["..."]}`.'
      tags:
      - Направления и услуги
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectionList'
              examples:
                Пример(seed-данные):
                  value:
                  - id: 17
                    slug: promyshlennaia-kooperatsiia
                    title: Промышленная кооперация
                    short_text: Связываем производителей для совместной работы.
                    icon: cooperation
                    order: 0
                    is_translated: true
                  summary: Пример (seed-данные)
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Невалидный параметр: `{"<параметр>": ["ошибка"]}`'
  /api/v1/directions/{slug}/:
    get:
      operationId: directions_retrieve
      description: Поиск по slug на любом языке.
      summary: Направление
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - ru
          - zh
          default: ru
        description: 'Язык ответа. По умолчанию ru. Невалидное значение → 400 `{"lang":
          ["..."]}`.'
      - in: path
        name: slug
        schema:
          type: string
        description: slug записи на любом из трёх языков (ru, en или zh)
        required: true
      tags:
      - Направления и услуги
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionDetail'
              examples:
                Пример(seed-данные):
                  value:
                    id: 17
                    slug: promyshlennaia-kooperatsiia
                    title: Промышленная кооперация
                    short_text: Связываем производителей для совместной работы.
                    content: <p>Связываем производителей для совместной работы.</p><p>Центр
                      промышленной кооперации помогает предприятиям Кыргызстана находить
                      партнёров, выходить на новые рынки и развивать совместные производства.</p>
                    icon: cooperation
                    order: 0
                    is_translated: true
                    seo:
                      meta_title: Промышленная кооперация
                      meta_description: Связываем производителей для совместной работы.
                      og_image: http://localhost:8000/media/CACHE/images/seo/icc-kyrgyzstan/2caac81c6a38255f974b5c2fc041f7f1.webp
                      alternates:
                        ru: promyshlennaia-kooperatsiia
                        en: industrial-cooperation
                        zh: gong-ye-he-zuo
                  summary: Пример (seed-данные)
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Невалидный параметр: `{"<параметр>": ["ошибка"]}`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Запись не найдена или не опубликована
  /api/v1/documents/:
    get:
      operationId: documents_list
      description: Документы с `show_in_documents=True`, переведённые на `lang`, по
        `order`.
      summary: Документы
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - ru
          - zh
          default: ru
        description: 'Язык ответа. По умолчанию ru. Невалидное значение → 400 `{"lang":
          ["..."]}`.'
      tags:
      - Справочная информация
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
              examples:
                Пример(seed-данные):
                  value:
                  - title: Положение о Центре
                    url: http://localhost:8000/media/documents/2026/10/polozhenie-o-centre.pdf
                    size: 46092
                    ext: pdf
                  summary: Пример (seed-данные)
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Невалидный параметр: `{"<параметр>": ["ошибка"]}`'
  /api/v1/event-types/:
    get:
      operationId: event_types_list
      description: Коды типов с подписями на языке запроса — для фильтра `type`.
      summary: Типы мероприятий
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - ru
          - zh
          default: ru
        description: 'Язык ответа. По умолчанию ru. Невалидное значение → 400 `{"lang":
          ["..."]}`.'
      tags:
      - Новости и мероприятия
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
              examples:
                Пример(seed-данные):
                  value:
                  - code: mission
                    label: 商务考察团
                  summary: Пример (seed-данные)
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Невалидный параметр: `{"<параметр>": ["ошибка"]}`'
  /api/v1/events/:
    get:
      operationId: events_list
      description: '`when=upcoming` — по `start_at` по возрастанию; `when=past` —
        по `start_at` по убыванию; без `when` — все, по убыванию. Предстоящее/прошедшее
        определяется по `end_at` (если пусто — по `start_at`).'
      summary: Мероприятия
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - ru
          - zh
          default: ru
        description: 'Язык ответа. По умолчанию ru. Невалидное значение → 400 `{"lang":
          ["..."]}`.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
          enum:
          - b2b
          - exhibition
          - forum
          - mission
          - other
        description: Тип мероприятия
      - in: query
        name: when
        schema:
          type: string
          enum:
          - past
          - upcoming
        description: Предстоящие или прошедшие
      tags:
      - Новости и мероприятия
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventListList'
              examples:
                Пример(seed-данные):
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - id: 21
                      slug: vebinar-po-eksportnym-protseduram
                      title: Вебинар по экспортным процедурам
                      type:
                        code: other
                        label: Другое
                      start_at: '2026-10-24T10:00:00+06:00'
                      end_at: null
                      location: Онлайн
                      excerpt: Таможня, сертификация, логистика.
                      cover:
                        small: http://localhost:8000/media/CACHE/images/events/2026/10/event-5/23e55ed6f8c76970f620e022bc0f643f.webp
                        large: http://localhost:8000/media/CACHE/images/events/2026/10/event-5/2d483ecbf1534a26d8dad05f0bf51c03.webp
                      is_upcoming: true
                      is_translated: true
                  summary: Пример (seed-данные)
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Невалидный параметр: `{"<параметр>": ["ошибка"]}`'
  /api/v1/events/{slug}/:
    get:
      operationId: events_retrieve
      description: 'Поиск по slug на любом языке. Без перевода на `lang` — 200, переводимые
        поля null, `is_translated: false`.'
      summary: Мероприятие
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - ru
          - zh
          default: ru
        description: 'Язык ответа. По умолчанию ru. Невалидное значение → 400 `{"lang":
          ["..."]}`.'
      - in: path
        name: slug
        schema:
          type: string
        description: slug записи на любом из трёх языков (ru, en или zh)
        required: true
      tags:
      - Новости и мероприятия
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
              examples:
                Пример(seed-данные):
                  value:
                    id: 17
                    slug: business-mission-to-xinjiang
                    title: Business mission to Xinjiang
                    type:
                      code: mission
                      label: Business mission
                    start_at: '2026-08-18T10:00:00+06:00'
                    end_at: '2026-08-21T10:00:00+06:00'
                    location: Urumqi
                    excerpt: Company visits and negotiations.
                    content: <p>Company visits and negotiations.</p><p>The Industrial
                      Cooperation Centre helps Kyrgyz companies find partners, enter
                      new markets and develop joint production.</p>
                    cover:
                      small: http://localhost:8000/media/CACHE/images/events/2026/10/event-1/0dd78e7373ae6d2000b6f19a4904b7e7.webp
                      large: http://localhost:8000/media/CACHE/images/events/2026/10/event-1/a510160fb27adf0dbad59cdb0183a770.webp
                    is_upcoming: false
                    gallery:
                    - small: http://localhost:8000/media/CACHE/images/gallery/2026/10/photo-1_36J5oXL/1052edca0ef98ab40469df6750c4015f.webp
                      large: http://localhost:8000/media/CACHE/images/gallery/2026/10/photo-1_36J5oXL/37275bf6f80a26d1fc57a4440653a0a4.webp
                      caption: Opening of the meeting
                    - small: http://localhost:8000/media/CACHE/images/gallery/2026/10/photo-2_qlX79ne/376505789d67531cd0df75fdda210bd2.webp
                      large: http://localhost:8000/media/CACHE/images/gallery/2026/10/photo-2_qlX79ne/c76ee863dfd4b1ca7f1ead3ade1e72f4.webp
                      caption: Negotiations
                    attachments: []
                    is_translated: true
                    seo:
                      meta_title: Business mission to Xinjiang
                      meta_description: Company visits and negotiations.
                      og_image: http://localhost:8000/media/CACHE/images/events/2026/10/event-1/a510160fb27adf0dbad59cdb0183a770.webp
                      alternates:
                        ru: biznes-missiia-v-sintszian
                        en: business-mission-to-xinjiang
                        zh: xin-jiang-shang-wu-kao-cha-tuan
                  summary: Пример (seed-данные)
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Невалидный параметр: `{"<параметр>": ["ошибка"]}`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Запись не найдена или не опубликована
  /api/v1/feedback/:
    post:
      operationId: feedback_create
      description: 'Форма «Контакты» / «Сотрудничество». Без авторизации и CSRF. Лимит
        — 5 запросов в час с одного IP (считаются все POST, включая невалидные), 6-й
        → 429. Поле `website` — honeypot: если заполнено, ответ тоже 201, но обращение
        не сохраняется.'
      summary: Отправить обращение
      tags:
      - Формы
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
            examples:
              Обращение:
                value:
                  type: cooperation
                  full_name: Асель Токтогулова
                  company: ОсОО «Ала-Тоо Текстиль»
                  country: Кыргызстан
                  email: asel@example.kg
                  phone: +996 555 123 456
                  subject: Поиск партнёра в Китае
                  message: Ищем производителя оборудования для швейного цеха.
                  consent: true
                  lang: ru
                  website: ''
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackCreated'
              examples:
                Успех:
                  value:
                    ok: true
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
              examples:
                ОшибкиВалидации:
                  value:
                    email:
                    - Обязательное поле.
                    message:
                    - Убедитесь, что это значение содержит не менее 10 символов.
                    consent:
                    - Необходимо согласие на обработку персональных данных.
                  summary: Ошибки валидации
          description: 'Ошибки по полям: {"<поле>": ["ошибка"]}'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                Лимит:
                  value:
                    detail: Слишком много обращений с вашего адреса. Попробуйте снова
                      через 3599 с.
          description: Превышен лимит запросов
  /api/v1/home/:
    get:
      operationId: home_retrieve
      description: 'Всё для главной одним запросом: опубликованные блоки (по order),
        4 направления, 3 последние новости, 3 ближайших предстоящих мероприятия и
        seo страницы `home`. Во всех списках — только записи, переведённые на `lang`.'
      summary: Главная
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - ru
          - zh
          default: ru
        description: 'Язык ответа. По умолчанию ru. Невалидное значение → 400 `{"lang":
          ["..."]}`.'
      tags:
      - Главная и страницы
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
              examples:
                Пример(seed-данные):
                  value:
