        языке.
      summary: Услуга
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - ru
          - zh
          default: ru
        description: 'Язык ответа. По умолчанию ru. Невалидное значение → 400 `{"lang":
          ["..."]}`.'
      - in: path
        name: slug
        schema:
          type: string
        description: slug записи на любом из трёх языков (ru, en или zh)
        required: true
      tags:
      - Направления и услуги
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetail'
              examples:
                Пример(seed-данные):
                  value:
                    id: 15
                    slug: podbor-partnerov-v-kitae
                    title: Подбор партнёров в Китае
                    short_text: Поиск и проверка производителей и поставщиков.
                    content: <p>Поиск и проверка производителей и поставщиков.</p><p>Центр
                      промышленной кооперации помогает предприятиям Кыргызстана находить
                      партнёров, выходить на новые рынки и развивать совместные производства.</p>
                    how_to_apply: Оставьте заявку через форму на сайте или позвоните
                      нам.
                    contact_person: Иванова Анна
                    contact_email: services@example.kg
                    contact_phone: +996 312 000 002
                    order: 0
                    is_translated: true
                    seo:
                      meta_title: Подбор партнёров в Китае
                      meta_description: Поиск и проверка производителей и поставщиков.
                      og_image: http://localhost:8000/media/CACHE/images/seo/icc-kyrgyzstan/2caac81c6a38255f974b5c2fc041f7f1.webp
                      alternates:
                        ru: podbor-partnerov-v-kitae
                        en: partner-search-in-china
                        zh: zai-zhong-guo-xun-zhao-he-zuo-huo-ban
                  summary: Пример (seed-данные)
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Невалидный параметр: `{"<параметр>": ["ошибка"]}`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Запись не найдена или не опубликована
  /api/v1/settings/:
    get:
      operationId: settings_retrieve
      description: |-
        Единая обработка ?lang=ru|en|zh для всех вьюх: валидирует параметр
        (невалидный → 400) и передаёт язык в контекст сериализатора.
      summary: Публичные настройки сайта
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - ru
          - zh
          default: ru
        description: 'Язык ответа. По умолчанию ru. Невалидное значение → 400 `{"lang":
          ["..."]}`.'
      tags:
      - Справочная информация
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettingsPublic'
              examples:
                Пример(seed-данные):
                  value:
                    analytics_id: null
                    default_og_image:
                      small: http://localhost:8000/media/CACHE/images/seo/icc-kyrgyzstan/829137d66a2b7af8d82c19ccd85a8b59.webp
                      large: http://localhost:8000/media/CACHE/images/seo/icc-kyrgyzstan/2caac81c6a38255f974b5c2fc041f7f1.webp
                  summary: Пример (seed-данные)
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: 'Невалидный параметр: `{"<параметр>": ["ошибка"]}`'
